name: Semantic Pull Request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# The check only reads the PR title. The job's own token is enough for that, and it keeps a
# personal access token out of a pull_request_target job, which runs with secrets for PRs
# from forks.
permissions:
  pull-requests: read

# Editing a title twice in a row started two runs that both post a status check.
# The newest title is the only one that matters, so the older run is cancelled.
# Keyed by PR number: under pull_request_target, github.ref is the base branch, so a
# ref-keyed group would let one PR's edit cancel another PR's check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main:
    if: github.repository == 'chaxus/ran'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Semantic Pull Request
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
