name: E2E

on:
  push:
    branches: [main]
    paths:
      - "packages/ranui/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/ranui/**"

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'chaxus/ran'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: "E2E (Chromium)"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter ranui exec playwright install chromium --with-deps

      - name: Build ranuts
        run: pnpm --filter ranuts run build

      - name: Build ranui
        run: pnpm --filter ranui run build

      # The whole suite, not just test/e2e/visual/ — the functional assertions (element
      # presence, text content, geometry, keyboard behaviour) all run on Linux and are what
      # this job actually gates on.
      #
      # Screenshot comparison is skipped here: `ignoreSnapshots` is on when CI=1, because the
      # committed baselines are macOS-rendered (`*-darwin.png`) and a Linux runner would
      # regenerate rather than compare them. See packages/ranui/CLAUDE.md.
      - name: Run E2E tests
        run: pnpm --filter ranui exec playwright test --project=chromium

      # im is the assembled application, and its defects have all been integration-level —
      # what the browser draws once the pieces are wired together, which no unit test sees.
      # The suite runs keyless against the built-in sample answer, so it needs no secret.
      - name: Run im E2E tests
        run: pnpm --filter im exec playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/ranui/playwright-report/
          retention-days: 7
