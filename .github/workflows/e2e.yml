name: E2E

on:
  push:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "packages/ranui/**"
      - "plugins/ran/**"
      - "design/**"
      - ".agents/plugins/**"
      - "packages/ranuts/**"
      - "packages/ranview/**"
      - "packages/im/**"
      # The docs build is ranpress; the ranui and ranview builds run
      # bin/prepare-declarations.ts; every package extends tsconfig.base.json.
      - "packages/ranpress/**"
      - "bin/**"
      - "tsconfig.base.json"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/docs/**"
      - "packages/ranui/**"
      - "plugins/ran/**"
      - "design/**"
      - ".agents/plugins/**"
      - "packages/ranuts/**"
      - "packages/ranview/**"
      - "packages/im/**"
      # The docs build is ranpress; the ranui and ranview builds run
      # bin/prepare-declarations.ts; every package extends tsconfig.base.json.
      - "packages/ranpress/**"
      - "bin/**"
      - "tsconfig.base.json"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

# E2E is the longest job in the repository: three browsers, each rebuilding ranuts
# and ranui. A superseded run has nothing left to tell us, so a new commit on the
# same ref cancels it instead of letting both finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.repository == 'chaxus/ran'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: "E2E (${{ matrix.browser }})"
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      # Shallow clone on purpose. This repository's history is hundreds of megabytes, and
      # nothing in this job reads it: the specs, both Playwright configs and the ranui
      # build all work off the working tree.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser download is keyed by the lockfile, which pins Playwright. System
      # packages are not cacheable this way, so a hit still installs those.
      # Playwright ships browser builds per distribution, so a runner image moving to a new
      # Ubuntu release must not restore the previous one's.
      - name: Read runner image
        id: runner-image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.runner-image.outputs.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ranui exec playwright install ${{ matrix.browser }} --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter ranui exec playwright install-deps ${{ matrix.browser }}

      - name: Build ranuts
        run: pnpm --filter ranuts run build

      - name: Verify agent-evaluation browser oracles (no model calls)
        if: matrix.browser == 'chromium'
        run: pnpm verify:agent-evals

      - name: Build ranui
        run: pnpm --filter ranui run build

      - name: Build documentation preview integration
        run: pnpm --filter docs run build

      - name: Verify standalone preview compatibility in the built documentation site
        run: pnpm --filter docs run test:preview --project=${{ matrix.browser }}

      - name: Exercise compaction cancellation without retries
        run: pnpm --filter im exec playwright test test/e2e/compaction-cancel.spec.ts --project=${{ matrix.browser }} --repeat-each=5 --retries=0

      # Engine assertions remain independent from the canonical screenshot gate below.
      - name: Run E2E tests
        run: pnpm --filter ranui exec playwright test --project=${{ matrix.browser }}

      # im is the assembled application, and its defects have all been integration-level —
      # what the browser draws once the pieces are wired together, which no unit test sees.
      # The suite runs keyless against the built-in sample answer, so it needs no secret.
      - name: Run im E2E tests
        run: pnpm --filter im exec playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            packages/ranui/playwright-report/
            packages/ranui/test-results/
            packages/im/test-results/
            .temp/docs-preview-results/
          retention-days: 7

  visual:
    if: github.repository == 'chaxus/ran'
    name: Visual (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # BuildKit's gha cache needs buildx and the runtime token the cache API uses.
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      # The launcher installs/builds the three required workspaces inside the same
      # digest-pinned renderer used for local baseline updates. Missing PNGs fail.
      - name: Compare reviewed screenshot baselines
        run: node packages/ranui/bin/visual.ts check
        env:
          RANUI_VISUAL_CACHE: gha
      - name: Upload visual differences and environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-linux-arm64
          path: packages/ranui/test-results/visual/
          retention-days: 7
