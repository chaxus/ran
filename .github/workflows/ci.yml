name: CI
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "bin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".npmrc"
      - ".oxlintrc.json"
      - ".prettier*"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "bin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".npmrc"
      - ".oxlintrc.json"
      - ".prettier*"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    if: github.repository == 'chaxus/ran'
    runs-on: ubuntu-latest
    name: "Lint & Type-check"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository scripts
        run: pnpm run verify:scripts

      - name: Verify coordinated release metadata
        run: pnpm release:check

      - name: Format check
        run: pnpm run lint:prettier

      # Generated docs (ranui COMPONENTS.md / style tokens, ranuts API.md and its two
      # docs-site copies) are committed. Without this, a component API change that
      # skipped `doc:api` leaves the reference silently wrong.
      #
      # `verify:docs` also runs `docs check:langs`. That gate already existed but was
      # wired only into the release workflow, so a PR could drop a page from one
      # language and stay green until someone cut a release.
      - name: Generated docs are fresh and every locale is complete
        run: pnpm run verify:docs

      # Every relative link in the repository's Markdown resolves. Like `check:langs`
      # above, this gate already existed but ran only in the release workflow, so a
      # rename could leave a dead link in prose and every PR stayed green until someone
      # cut a release. A dead link is silent damage: the reader clicks, gets a 404, and
      # concludes the docs are stale.
      - name: Every Markdown link resolves
        run: pnpm run verify:links

      # The executable half of docs/DESIGN.md. Prose rules only hold while whoever
      # edits a component has read the paragraph; this ratchets the known violations
      # so no new one lands and no fix silently regresses.
      - name: Design rules hold
        run: pnpm run verify:design

      - name: Lint
        run: pnpm run lint

  build-test:
    if: github.repository == 'chaxus/ran'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [24, 26]
        include:
          - os: macos-latest
            node_version: 26
          - os: windows-latest
            node_version: 26
      fail-fast: false
    name: "Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint published package manifests
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 24
        run: pnpm run publint

      - name: Verify packed library consumers and import budget
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 24
        run: pnpm run verify:consumers

      - name: Verify real installation of release archives
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 24
        run: |
          pnpm release:prepare
          pnpm verify:release

      - name: Test
        run: pnpm run test

      - name: Check ranui coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 24
        run: pnpm -F ranui test:unit:coverage
