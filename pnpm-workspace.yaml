packages:
  # all packages in subdirs of packages/ and components/
  - 'packages/**'
# Single source of truth for versions of shared build/test tooling.
# Packages reference these with "catalog:" so every workspace stays on one version.
catalog:
  '@types/node': 26.1.2
  '@vitest/coverage-v8': 4.1.10
  less: 4.8.1
  terser: 5.49.2
  tsx: 4.23.10
  typescript: 7.0.2
  vite: 8.2.1
  vitest: 4.1.10
# Force patched versions of transitively-pulled build tools (Dependabot advisories).
overrides:
  esbuild: 0.28.1
  # postcss asks for nanoid ^3.3.17, so the lockfile settled on 3.3.17 — one release short of
  # the advisory fix. Dependabot cannot raise it on its own (its security PR fails with
  # "security_update_not_possible"), so pin the first non-vulnerable 3.x here.
  nanoid: 3.3.18
  '@babel/core': 7.29.7
  # jsdom@29 (ranuts) pulls a vulnerable undici 7.x; jsdom@30 (ranui) already
  # resolves undici 8.x which is unaffected, so scope the fix to jsdom@29's chain.
  'jsdom@29.1.1>undici': 7.29.0
  # @ranui/preview (split out of this repo) pins old published ranui/ranuts,
  # which would drag tesseract.js back into the lockfile — use the workspace code.
  '@ranui/preview>ranui': 'workspace:*'
  '@ranui/preview>ranuts': 'workspace:*'
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
# Own package: bare name required — versioned entries don't satisfy the
# pre-run lockfile verification (same lesson as document/fileview repos).
minimumReleaseAgeExclude:
  - '@ranui/preview'
